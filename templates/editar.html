<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar producto</title>
</head>

<body>

    <h1>Editar producto</h1>

    <form method="POST">

        <label>Nombre:</label>
        <input
            type="text"
            name="nombre"
            value="{{ producto[1] }}"
            required
        >

        <br><br>

        <label>Descripción:</label>
        <input
            type="text"
            name="descripcion"
            value="{{ producto[2] }}"
            required
        >

        <br><br>

        <label>Precio:</label>
        <input
            type="number"
            name="precio"
            step="0.01"
            min="0.01"
            value="{{ producto[3] }}"
            required
        >

        <br><br>

        <label>Stock:</label>
        <input
            type="number"
            name="stock"
            min="0"
            value="{{ producto[4] }}"
            required
        >

        <br><br>

        <label>Categoría:</label>
        <input
            type="text"
            name="categoria"
            value="{{ producto[5] }}"
            required
        >

        <br><br>

        <button type="submit">
            Guardar cambios
        </button>

    </form>

    <br>

    <a href="/productos">Cancelar</a>

</body>

</html>
