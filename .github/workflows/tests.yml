name: Pruebas de Python

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIPENV_VENV_IN_PROJECT: "1"
      PIPENV_DONT_LOAD_ENV: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Instalar Pipenv
        run: python -m pip install pipenv
      - name: Instalar las versiones fijadas
        run: pipenv sync --dev
      - name: Ejecutar pruebas sin base de datos
        run: pipenv run python -m pytest -q
